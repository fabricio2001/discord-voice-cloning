name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  discord-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/discord-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/discord-bot/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
